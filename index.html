
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azimuth - Stellar AI Terminal</title>
    <!-- Frameworks & Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }

        /* Starfield & Black Hole Background */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .black-hole-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            z-index: -1;
            pointer-events: none;
            opacity: 0.4;
        }

        .singularity {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            background: black;
            border-radius: 50%;
            box-shadow: 0 0 40px 10px #000, 0 0 80px 20px rgba(34, 211, 238, 0.2);
        }

        .accretion-disk {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 140px;
            transform: translate(-50%, -50%) rotateX(75deg);
            border-radius: 50%;
            background: radial-gradient(circle at center, transparent 30%, rgba(255, 140, 0, 0.5) 45%, rgba(138, 43, 226, 0.3) 65%, transparent 85%);
            filter: blur(10px);
            animation: rotate-disk 20s linear infinite;
        }

        @keyframes rotate-disk {
            from { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(360deg); }
        }

        /* UI Styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-bubble-user {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.7) 0%, rgba(59, 130, 246, 0.7) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-bubble-model {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @keyframes rocket-vibrate {
            0%, 100% { transform: translate(0, 0) rotate(45deg); }
            50% { transform: translate(-1px, 1px) rotate(44deg); }
        }
        .animate-rocket { animation: rocket-vibrate 0.1s infinite linear; }

        .message-stream-pulse::after {
            content: '✧';
            display: inline-block;
            margin-left: 8px;
            animation: pulse-star 1s infinite;
            color: #22d3ee;
        }
        @keyframes pulse-star { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; transform: scale(1.2); } }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.4",
        "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
        "@google/genai": "https://esm.sh/@google/genai@1.41.0",
        "react-markdown": "https://esm.sh/react-markdown@10.1.0",
        "remark-gfm": "https://esm.sh/remark-gfm@4.0.0",
        "remark-math": "https://esm.sh/remark-math@6.0.0",
        "rehype-katex": "https://esm.sh/rehype-katex@7.0.0"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="space-bg" id="space-bg"></div>
    <div class="black-hole-container">
        <div class="accretion-disk"></div>
        <div class="singularity"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { GoogleGenAI } from "@google/genai";
        import ReactMarkdown from 'react-markdown';
        import remarkGfm from 'remark-gfm';
        import remarkMath from 'remark-math';
        import rehypeKatex from 'rehype-katex';

        // --- Persistence Helper ---
        const getPersistenceKey = (email) => {
          if (!email) return 'anon_data';
          const cleanEmail = email.toLowerCase().trim();
          // Generate a simple persistent identifier from the email
          let hash = 0;
          for (let i = 0; i < cleanEmail.length; i++) {
            hash = ((hash << 5) - hash) + cleanEmail.charCodeAt(i);
            hash |= 0;
          }
          return `voyager_v1_${Math.abs(hash)}`;
        };

        // --- Components ---
        const ProcessingIndicator = () => (
          <div className="flex items-center gap-4 max-w-5xl mx-auto w-full px-4 mb-8">
            <div className="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center border border-white/5 overflow-hidden">
              <i className="fa-solid fa-rocket animate-rocket text-cyan-400 rotate-45"></i>
            </div>
            <div className="flex flex-col">
              <span className="text-[10px] font-black uppercase tracking-widest text-cyan-500">Uplinking Signal</span>
              <span className="text-xs text-slate-400 italic">Synthesizing galactic response...</span>
            </div>
          </div>
        );

        const AuthScreen = ({ onLogin }) => {
          const [email, setEmail] = useState('');
          const [name, setName] = useState('');
          const [loading, setLoading] = useState(false);

          const handleJoin = (e) => {
            e.preventDefault();
            setLoading(true);
            const persistenceId = getPersistenceKey(email);
            setTimeout(() => {
              onLogin({ id: persistenceId, email: email.toLowerCase().trim(), name: name || email.split('@')[0] });
            }, 800);
          };

          return (
            <div className="min-h-screen flex items-center justify-center p-6 relative z-10">
              <div className="glass-panel w-full max-w-md p-10 rounded-[3rem] shadow-2xl space-y-8">
                <div className="text-center space-y-4">
                  <div className="w-20 h-20 bg-gradient-to-br from-cyan-500 to-blue-700 rounded-3xl mx-auto flex items-center justify-center shadow-lg">
                    <i className="fa-solid fa-shuttle-space text-3xl text-white"></i>
                  </div>
                  <h1 className="text-4xl font-black italic tracking-tighter">AZIMUTH</h1>
                  <p className="text-slate-500 text-[10px] tracking-[0.4em] uppercase font-bold">Stellar Intelligence Terminal</p>
                </div>
                <form onSubmit={handleJoin} className="space-y-4">
                  <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="Enter Gmail Address" className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white focus:outline-none focus:border-cyan-500/50" />
                  <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Display Name (Optional)" className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white focus:outline-none focus:border-cyan-500/50" />
                  <button type="submit" className="w-full bg-cyan-600 py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg hover:bg-cyan-500 transition-all">
                    {loading ? 'Validating ID...' : 'Establish Uplink'}
                  </button>
                </form>
                <p className="text-center text-[10px] text-slate-600 uppercase tracking-widest leading-loose">
                  Uplinking via the same Gmail restores your mission history automatically.
                </p>
              </div>
            </div>
          );
        };

        const App = () => {
          const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('azimuth_user')));
          const [chats, setChats] = useState([]);
          const [chatId, setChatId] = useState(null);
          const [input, setInput] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const [model, setModel] = useState('gemini-3-flash-preview');

          const modelOptions = [
            { name: 'Flash', id: 'gemini-3-flash-preview' },
            { name: 'Lite', id: 'gemini-flash-lite-latest' },
            { name: 'Pro', id: 'gemini-3-pro-preview' },
            { name: 'Lite Pro', id: 'gemini-2.5-flash-preview-09-2025' }
          ];

          useEffect(() => {
            if (currentUser) {
              localStorage.setItem('azimuth_user', JSON.stringify(currentUser));
              const saved = JSON.parse(localStorage.getItem(`chats_${currentUser.id}`) || '[]');
              setChats(saved);
            }
          }, [currentUser]);

          useEffect(() => {
            if (currentUser && chats.length > 0) {
              localStorage.setItem(`chats_${currentUser.id}`, JSON.stringify(chats));
            }
          }, [chats, currentUser]);

          const activeChat = useMemo(() => chats.find(c => c.id === chatId) || null, [chats, chatId]);

          const sendMessage = async (e) => {
            if (e) e.preventDefault();
            if (!input.trim() || isLoading) return;

            const userText = input;
            setInput('');
            
            const currentChatId = chatId || Date.now().toString();
            const userMsg = { role: 'user', text: userText, id: Date.now().toString() };
            const modelMsgId = (Date.now() + 1).toString();
            const placeholder = { role: 'model', text: '', id: modelMsgId, isStreaming: true };

            if (!chatId) {
              const newChat = { id: currentChatId, title: userText.substring(0, 24) + '...', messages: [userMsg, placeholder] };
              setChats(prev => [newChat, ...prev]);
              setChatId(currentChatId);
            } else {
              setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, messages: [...c.messages, userMsg, placeholder] } : c));
            }

            setIsLoading(true);

            try {
              const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
              
              // PREVENT "UPLINK FAILED": Filter history to ensure every message has valid text
              // and remove any currently streaming placeholders.
              const cleanHistory = activeChat 
                ? activeChat.messages.filter(m => m.text && m.text.trim() !== '' && !m.isStreaming)
                : [];
              
              const contents = [...cleanHistory, userMsg].map(m => ({ 
                role: m.role, 
                parts: [{ text: m.text }] 
              }));

              const response = await ai.models.generateContent({
                model,
                contents,
                config: { systemInstruction: `You are Azimuth, a powerful cosmic AI assistant for Voyager ${currentUser.name}.` }
              });

              const text = response.text || "No signal received from terminal.";
              
              setChats(prev => prev.map(c => c.id === currentChatId ? {
                ...c,
                messages: c.messages.map(m => m.id === modelMsgId ? { ...m, text: text, isStreaming: false } : m)
              } : c));

            } catch (err) {
              console.error("Transponder Failure:", err);
              const errorNote = "Uplink Interrupted. Please ensure your core API key is valid and you have an active network connection.";
              
              setChats(prev => prev.map(c => c.id === currentChatId ? {
                ...c,
                messages: c.messages.map(m => m.id === modelMsgId ? { ...m, text: errorNote, isStreaming: false } : m)
              } : c));
            } finally {
              setIsLoading(false);
            }
          };

          if (!currentUser) return <AuthScreen onLogin={setCurrentUser} />;

          return (
            <div className="flex h-screen w-full relative z-10 overflow-hidden">
              {/* Sidebar */}
              <aside className="w-80 glass-panel p-6 flex flex-col border-r border-white/5">
                <div className="flex items-center gap-3 mb-10">
                  <i className="fa-solid fa-shuttle-space text-cyan-400"></i>
                  <h1 className="text-2xl font-black italic bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">AZIMUTH</h1>
                </div>
                <button onClick={() => { setChatId(null); setInput(''); }} className="w-full bg-white/5 p-4 rounded-2xl mb-6 hover:bg-white/10 transition-all font-bold border border-white/5">+ Start New Mission</button>
                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2">
                  {chats.length === 0 && <p className="text-[10px] text-slate-600 uppercase tracking-widest text-center py-10 opacity-40 italic">Deep Space Waiting...</p>}
                  {chats.map(c => (
                    <div key={c.id} onClick={() => setChatId(c.id)} className={`p-4 rounded-xl cursor-pointer transition-all border ${chatId === c.id ? 'bg-cyan-500/20 text-white border-cyan-500/30' : 'text-slate-500 border-transparent hover:bg-white/5'}`}>
                      <i className="fa-solid fa-compass text-[10px] mr-2 opacity-30"></i>
                      <span className="truncate">{c.title}</span>
                    </div>
                  ))}
                </div>
                <div className="mt-auto pt-6 border-t border-white/5 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center font-black uppercase text-cyan-400 border border-white/10">{currentUser.name[0]}</div>
                    <div className="flex flex-col">
                      <span className="font-bold text-sm truncate max-w-[120px]">{currentUser.name}</span>
                      <span className="text-[8px] text-cyan-500/50 uppercase font-bold tracking-widest">Voyager Logged In</span>
                    </div>
                  </div>
                  <button onClick={() => { localStorage.removeItem('azimuth_user'); setCurrentUser(null); }} className="text-slate-600 hover:text-rose-400"><i className="fa-solid fa-power-off"></i></button>
                </div>
              </aside>

              {/* Terminal */}
              <main className="flex-1 flex flex-col bg-transparent">
                <header className="p-6 flex items-center justify-between glass-panel border-b border-white/5">
                  <div className="flex flex-col">
                    <span className="text-lg font-black uppercase italic tracking-tight">{activeChat?.title || 'Gateway Hub'}</span>
                    <span className="text-[10px] text-cyan-500 tracking-[0.3em] uppercase font-bold">Authenticated Terminal</span>
                  </div>
                  <div className="flex bg-white/5 rounded-xl p-1 border border-white/10">
                    {modelOptions.map((m) => (
                      <button key={m.id} onClick={() => setModel(m.id)} className={`px-4 py-1.5 rounded-lg text-[10px] font-black uppercase transition-all ${model === m.id ? 'bg-cyan-600 text-white' : 'text-slate-500 hover:text-slate-300'}`}>
                        {m.name}
                      </button>
                    ))}
                  </div>
                </header>

                <div className="flex-1 overflow-y-auto custom-scrollbar p-8 space-y-12">
                  {!activeChat ? (
                    <div className="h-full flex flex-col items-center justify-center text-center space-y-6">
                      <div className="w-24 h-24 bg-slate-900 rounded-[2rem] flex items-center justify-center border border-white/10 shadow-2xl animate-pulse"><i className="fa-solid fa-atom text-4xl text-cyan-400"></i></div>
                      <h2 className="text-4xl font-black italic">Welcome, <span className="text-cyan-500">{currentUser.name}</span></h2>
                      <p className="text-slate-400 max-w-md mx-auto text-lg leading-relaxed">Mission logs have been successfully restored. Subspace channels are open for your command.</p>
                    </div>
                  ) : (
                    activeChat.messages.map(m => (
                      <div key={m.id} className={`flex gap-6 max-w-5xl mx-auto ${m.role === 'user' ? 'flex-row-reverse text-right' : ''}`}>
                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 shadow-lg ${m.role === 'user' ? 'bg-slate-800' : 'bg-gradient-to-br from-cyan-500 to-blue-600'}`}>
                          <i className={`fa-solid ${m.role === 'user' ? 'fa-user-astronaut' : 'fa-brain'} text-xs text-white`}></i>
                        </div>
                        <div className={`p-8 rounded-[2.5rem] text-[17px] leading-relaxed shadow-xl ${m.role === 'user' ? 'glass-bubble-user rounded-tr-none' : 'glass-bubble-model rounded-tl-none'}`}>
                          <ReactMarkdown remarkPlugins={[remarkGfm, remarkMath]} rehypePlugins={[rehypeKatex]}>
                            {m.text}
                          </ReactMarkdown>
                          {m.isStreaming && <div className="message-stream-pulse"></div>}
                        </div>
                      </div>
                    ))
                  )}
                  {isLoading && <ProcessingIndicator />}
                </div>

                <div className="p-8 bg-gradient-to-t from-[#020617] via-[#020617] to-transparent">
                  <form onSubmit={sendMessage} className="max-w-4xl mx-auto flex gap-4 glass-panel p-4 rounded-[2.5rem] border border-white/10 shadow-2xl focus-within:border-cyan-500/50 transition-all">
                    <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && !e.shiftKey && sendMessage(e)} placeholder="Send mission command..." className="flex-1 bg-transparent border-none focus:ring-0 p-4 resize-none h-14 custom-scrollbar text-lg" />
                    <button type="submit" disabled={!input.trim() || isLoading} className="w-14 h-14 bg-cyan-600 rounded-2xl flex items-center justify-center hover:bg-cyan-500 disabled:opacity-20 transition-colors">
                      {isLoading ? <i className="fa-solid fa-rocket animate-rocket rotate-[-45deg]"></i> : <i className="fa-solid fa-paper-plane"></i>}
                    </button>
                  </form>
                  <p className="text-[9px] text-center mt-4 text-slate-700 uppercase tracking-[0.5em] font-black opacity-50">Stellar Framework &middot; Core: {modelOptions.find(o => o.id === model)?.name}</p>
                </div>
              </main>
            </div>
          );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>

    <script>
        // Starfield initialization
        const bg = document.getElementById('space-bg');
        for (let i = 0; i < 150; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2 + 0.5;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            s.style.animationDelay = Math.random() * 5 + 's';
            bg.appendChild(s);
        }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
